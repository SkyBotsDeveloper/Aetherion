name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install media tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt ruff
          python -m pip check
      - name: Check Python syntax and undefined names
        run: ruff check . --select F821,F822,F823,E9
      - name: Check launch scripts
        run: bash -n setup start
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
